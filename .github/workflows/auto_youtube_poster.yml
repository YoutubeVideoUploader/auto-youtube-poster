name: Auto YouTube Video Render & Uploader

on:
  workflow_dispatch:
    inputs:
      drive_thumbnail_url:
        description: 'Google Drive Thumbnail Link (Optional)'
        required: false
        default: ''
      privacy_status:
        description: 'YouTube Privacy Status (unlisted, private, public)'
        required: true
        default: 'unlisted'
      sections:
        description: 'Worksheet sections to include (movie_updates, release_updates, ott_updates or "all")'
        required: false
        default: ''
  repository_dispatch:
    types: [trigger_youtube_upload]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🎬 Install FFmpeg and Broadcast Fonts (English & Malayalam)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-freefont-ttf fonts-indic fonts-smc fonts-lohit-mlym fonts-samyak-mlym fonts-noto-core fonts-noto-extra

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests pillow edge-tts soundfile scipy openpyxl google-api-python-client google-auth-oauthlib google-auth-httplib2 xlsxwriter

      - name: 🔑 Restore YouTube OAuth Token
        env:
          YOUTUBE_TOKEN_DATA: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p outputs
          echo "$YOUTUBE_TOKEN_DATA" > outputs/youtube_token.json

      - name: 🎙️ 1. Synthesize Malayalam Voice Audio from Google Sheets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          RAW_SECTIONS: ${{ github.event.inputs.sections || github.event.client_payload.sections || '' }}
          RAW_PRIVACY: ${{ github.event.inputs.privacy_status || github.event.client_payload.privacy_status || '' }}
          RAW_DRIVE_URL: ${{ github.event.inputs.drive_thumbnail_url || github.event.client_payload.drive_thumbnail_url || '' }}
        run: |
          python -c "
          import os, re

          raw_priv = os.environ.get('RAW_PRIVACY', '').strip()
          raw_drive = os.environ.get('RAW_DRIVE_URL', '').strip()
          raw_sections = os.environ.get('RAW_SECTIONS', '').strip()

          sections = ''
          if '#sections=' in raw_priv:
              sections = raw_priv.split('#sections=')[1].strip()
          elif '__SECTIONS__:' in raw_drive:
              m = re.search(r'__SECTIONS__:([a-zA-Z0-9_,]+)', raw_drive)
              if m:
                  sections = m.group(1).strip()
          elif raw_sections:
              sections = raw_sections

          if not sections:
              sections = 'all'

          print(f'RESOLVED SECTIONS: {sections}')
          with open('resolved_sections.txt', 'w', encoding='utf-8') as f:
              f.write(sections)
          "
          SECTIONS_ARG=$(cat resolved_sections.txt)
          echo "Executing generation with sections: $SECTIONS_ARG"
          python generate_from_google_sheet.py gemini_voice --sections "$SECTIONS_ARG"

      - name: 🎞️ 2. Render 1080p Full HD MP4 Presentation Video
        run: |
          python generate_video_from_audio_and_images.py

      - name: 🚀 3. Upload Video to YouTube
        env:
          RAW_DRIVE_URL: ${{ github.event.inputs.drive_thumbnail_url || github.event.client_payload.drive_thumbnail_url || '' }}
          RAW_PRIVACY: ${{ github.event.inputs.privacy_status || github.event.client_payload.privacy_status || 'unlisted' }}
          RAW_SECTIONS: ${{ github.event.inputs.sections || github.event.client_payload.sections || '' }}
        run: |
          python -c "
          from youtube_uploader import YouTubeUploader
          from metadata_generator import generate_english_title, generate_youtube_description, generate_youtube_tags, generate_youtube_chapters, download_thumbnail_from_drive
          from google_sheet_manager import GoogleSheetManager
          from pathlib import Path
          import os, re

          resolved_file = Path('resolved_sections.txt')
          if resolved_file.exists():
              sections_input = resolved_file.read_text(encoding='utf-8').strip()
          else:
              raw_priv = os.environ.get('RAW_PRIVACY', '').strip()
              raw_drive = os.environ.get('RAW_DRIVE_URL', '').strip()
              raw_sections = os.environ.get('RAW_SECTIONS', '').strip()

              sections_input = ''
              if '#sections=' in raw_priv:
                  sections_input = raw_priv.split('#sections=')[1].strip()
              elif '__SECTIONS__:' in raw_drive:
                  m = re.search(r'__SECTIONS__:([a-zA-Z0-9_,]+)', raw_drive)
                  if m:
                      sections_input = m.group(1).strip()
              elif raw_sections:
                  sections_input = raw_sections

          active_sections = None if not sections_input or sections_input in ['all', '', '*', 'all_sections', 'all_3'] else [s.strip() for s in re.split(r'[,+\s]+', sections_input) if s.strip()]
          if active_sections and len(active_sections) == 3:
              active_sections = None
          print('Active sections for YouTube metadata:', active_sections)

          raw_priv = os.environ.get('RAW_PRIVACY', 'unlisted')
          clean_privacy = raw_priv.split('#')[0].strip() if '#' in raw_priv else raw_priv.strip()
          if clean_privacy not in ['unlisted', 'private', 'public']:
              clean_privacy = 'unlisted'

          raw_drive = os.environ.get('RAW_DRIVE_URL', '').strip()
          clean_drive = re.sub(r'\|*__SECTIONS__:[a-zA-Z0-9_,]+', '', raw_drive).strip().strip('|')

          mgr = GoogleSheetManager()
          data = mgr.fetch_all_tabs(force_refresh=True)

          title = generate_english_title(sections=active_sections)
          desc = generate_youtube_description(data, sections=active_sections)
          tags = generate_youtube_tags(sheet_data=data, sections=active_sections)
          chapters = generate_youtube_chapters(sheet_data=data, sections=active_sections)

          thumb_path = download_thumbnail_from_drive(clean_drive, sheet_data=data, sections=active_sections)

          uploader = YouTubeUploader()
          res = uploader.upload_video(
              video_path='outputs/Malayalam_Movie_News_Presenter_1080p.mp4',
              title=title,
              description=desc,
              tags=tags,
              privacy_status=clean_privacy,
              thumbnail_path=thumb_path,
              chapters=chapters,
              sheet_mgr=mgr
          )
          print('YOUTUBE UPLOAD SUCCESSFUL:', res)
          "
